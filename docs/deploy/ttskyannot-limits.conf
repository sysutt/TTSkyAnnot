# 解析接口（/api/i/solve）的入口限速。
# 桌面端（TTSkyAnnot）按来源 IP 计数；小程序统一走 jiaowa 后端（120.79.222.226）转发，来源 IP 只有这一台，
# 按单 IP 计数会把所有小程序用户一起卡死，所以把它的 key 置空（nginx 对空 key 不计数），
# 小程序那一侧的额度由 interactions_service.py 里的“小程序池”单独控制。
map $remote_addr $solve_limit_key {
    default          $binary_remote_addr;
    120.79.222.226   "";
}
limit_req_zone $solve_limit_key zone=solve_ip:10m rate=4r/s;
limit_req_status 429;

map $remote_addr $solve_conn_key {
    default          $binary_remote_addr;
    120.79.222.226   "";
}
limit_conn_zone $solve_conn_key zone=solve_conn:10m;
limit_conn_status 429;